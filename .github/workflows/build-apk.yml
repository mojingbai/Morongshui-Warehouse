
name: Build SheepFarmerLite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          set -eu
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -eu
          cd /tmp
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -eu
          gradle wrapper --gradle-version 8.9
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build release APK
        shell: bash
        run: |
          set -eu
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name "*.apk" 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
