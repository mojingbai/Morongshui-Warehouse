
name: Build SheepFarmerLite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          set -eu
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -eu
          cd /tmp
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -eu
          gradle wrapper --gradle-version 8.9
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        shell: bash
        run: |
          set -eu
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -eu
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SheepFarmerLite-Signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
