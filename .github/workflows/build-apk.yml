name: Build SheepFarmerLite APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 使用官方维护的 Android SDK 安装方式
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true
          api-level: 34
          build-tools: "34.0.0"

      # 确认文件存在并赋予权限
      - name: Prepare Gradle
        run: |
          ls -la
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating..."
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
