name: Build SheepFarmerLite APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04  # 用 22.04 更稳，和新版 SDK 完全兼容

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 手动下载 + 正确配置，完全避开所有第三方动作的坑
      - name: Setup Android SDK
        run: |
          ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # 下载最新版命令行工具（用能正常访问的地址）
          cd /tmp
          curl -L -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076715_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/"

          # 按 Google 要求的目录结构摆放（关键！结构错 sdkmanager 就找不到自己）
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/"

          # 加入环境变量
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

          # 接受许可并安装组件
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
