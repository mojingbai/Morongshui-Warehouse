name: Build SheepFarmerLite APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          cd /tmp

          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076715_latest.zip"

          echo "Downloading Android command-line tools..."
          curl --fail --location --retry 3 --retry-delay 2 \
            "$SDK_URL" \
            --output cmdline-tools.zip

          echo "Checking downloaded ZIP..."
          if ! unzip -tq cmdline-tools.zip; then
            echo "::error::Android SDK download is not a valid ZIP file."
            echo "Please check network access to dl.google.com."
            exit 1
          fi

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdline-tools.zip -d /tmp/android-sdk-tools

          if [ ! -f /tmp/android-sdk-tools/cmdline-tools/bin/sdkmanager ]; then
            echo "::error::sdkmanager was not found in the downloaded archive."
            exit 1
          fi

          cp -a /tmp/android-sdk-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "Installing Android SDK components..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Gradle files
        shell: bash
        run: |
          set -e
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "::error::gradlew is missing from the repository."
            echo "Upload the Gradle wrapper files or generate them in Android Studio."
            exit 1
          fi

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        if: always()
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
