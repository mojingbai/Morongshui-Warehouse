name: Build SheepFarmerLite APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # 不用 set -e，避免中间一步失败整体终止
          ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

          echo "Creating directories..."
          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cd /tmp
          echo "Downloading commandlinetools..."
          wget -v https://dl.google.com/android/repository/commandlinetools-linux-11076715_latest.zip -O cmdline-tools.zip
          
          echo "Unzipping..."
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/"

          echo "Moving files..."
          mv "$ANDROID_HOME/cmdline-tools/bin" "$ANDROID_HOME/cmdline-tools/latest/" || true
          mv "$ANDROID_HOME/cmdline-tools/lib" "$ANDROID_HOME/cmdline-tools/latest/" || true
          mv "$ANDROID_HOME/cmdline-tools/NOTICE.txt" "$ANDROID_HOME/cmdline-tools/latest/" || true
          mv "$ANDROID_HOME/cmdline-tools/source.properties" "$ANDROID_HOME/cmdline-tools/latest/" || true

          echo "Accepting licenses..."
          yes | sdkmanager --licenses || true

          echo "Installing SDK components..."
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
