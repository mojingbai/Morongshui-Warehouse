name: Build SheepFarmerLite APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          cd /tmp
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          curl --fail --location --retry 3 \
            "$SDK_URL" \
            --output cmdline-tools.zip
          unzip -tq cmdline-tools.zip
          mkdir -p /tmp/android-sdk-tools
          unzip -q cmdline-tools.zip -d /tmp/android-sdk-tools
          test -f /tmp/android-sdk-tools/cmdline-tools/bin/sdkmanager
          cp -a /tmp/android-sdk-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Check Gradle files
        shell: bash
        run: |
          set -e
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
      - name: Grant execute permission
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew is missing from the repository."
            exit 1
          fi
          chmod +x ./gradlew
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: List APK files
        if: always()
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SheepFarmerLite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
